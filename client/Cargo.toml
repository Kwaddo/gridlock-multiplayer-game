[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4.14"
rand = "0.8" 
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "../protocol" }
transport = { path = "../transport" }
server = { path = "../server" }
platform = { path = "../platform" }
gltf = { version = "1.4", features = ["KHR_materials_pbrSpecularGlossiness"] }
# The version gltf uses, for decoding its embedded textures ourselves.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
glam = "0.29"

# Native only: audio through rodio, and online play (host list over HTTP,
# router port mapping). The browser build gets these through miniquad and the
# gridlock_web JS plugin instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = "0.20"
ureq = { version = "3", features = ["json"] }
igd-next = "0.18"
natpmp = "0.5"
