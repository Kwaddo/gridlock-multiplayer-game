[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4.14"
rand = "0.8" 
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = { version = "1.4", features = ["KHR_materials_pbrSpecularGlossiness"] }
rodio = "0.20"
glam = "0.29"
cross = "0.2.5"

[profile.dev]
opt-level = 2
debug = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
