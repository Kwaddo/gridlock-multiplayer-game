<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Credits - Gridlock</title>
    <meta name="description" content="The third-party models, sprites and fonts Gridlock uses, and their creators.">
    <meta name="theme-color" content="#ff6b36">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @font-face {
            font-family: "Pixel";
            src: url("assets/fonts/Pixel Game.otf");
        }
        html, body {
            margin: 0;
            background: #0f0f1f;
            color: #b8bcd6;
            font-family: "Pixel", monospace;
            font-size: 17px;
            line-height: 1.5;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 16px 48px;
        }
        h1 {
            margin: 0 0 4px;
            color: #e0e0e0;
            font-size: 40px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        .bar {
            width: 120px;
            height: 3px;
            margin-bottom: 20px;
            background: #ff6b36;
        }
        h2 {
            margin: 32px 0 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #333d66;
            color: #ff6b36;
            font-size: 22px;
            font-weight: normal;
        }
        p { margin: 8px 0; }
        a { color: #8cb8ff; }
        a:hover { color: #fff; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
        }
        th, td {
            padding: 4px 8px;
            text-align: left;
            vertical-align: top;
        }
        th {
            color: #808499;
            font-weight: normal;
        }
        tr:nth-child(even) td { background: #121427; }
        td:first-child { width: 34%; }
        .back { display: inline-block; margin-top: 32px; }
    </style>
</head>
<body>
    <main>
        <!-- filled in from credits.md (the repo's CREDITS.md, copied by build_web.sh) -->
        <div id="credits">
            <h1>CREDITS</h1>
            <div class="bar"></div>
            <noscript>
                <p>Read the credits in
                    <a href="https://github.com/Kwaddo/gridlock-multiplayer-game/blob/main/CREDITS.md">CREDITS.md</a>.</p>
            </noscript>
        </div>
        <a class="back" href="./">Back to Gridlock</a>
    </main>
    <script>
        "use strict";
        // The Markdown CREDITS.md uses, nothing more (the game reads the same
        // subset, client/src/screens/login/credits/doc.rs): "#"/"##" headings,
        // paragraphs, "- " lists, tables and [text](url) links. Comments are dropped.
        const escapeHtml = (s) =>
            s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

        function inline(s) {
            let out = "";
            let rest = s;
            for (;;) {
                const open = rest.indexOf("[");
                const mid = open < 0 ? -1 : rest.indexOf("](", open);
                const close = mid < 0 ? -1 : rest.indexOf(")", mid + 2);
                if (close < 0) break;
                const url = rest.slice(mid + 2, close).trim();
                const label = escapeHtml(rest.slice(open + 1, mid));
                out += escapeHtml(rest.slice(0, open));
                out += /^https?:\/\//i.test(url)
                    ? `<a href="${escapeHtml(url)}" rel="noopener">${label}</a>`
                    : label;
                rest = rest.slice(close + 1);
            }
            return out + escapeHtml(rest);
        }

        const cells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
        const isRule = (line) => cells(line).every((c) => /^[-: ]+$/.test(c));

        function render(md) {
            md = md.replace(/<!--[\s\S]*?(-->|$)/g, "");
            const html = [];
            let paragraph = [];
            let table = null;
            const flush = () => {
                if (paragraph.length) html.push(`<p>${inline(paragraph.join(" "))}</p>`);
                paragraph = [];
                if (table) html.push(`<table>${table.join("")}</table>`);
                table = null;
            };
            for (const raw of md.split("\n")) {
                const line = raw.trim();
                if (line.startsWith("|")) {
                    if (paragraph.length) {
                        html.push(`<p>${inline(paragraph.join(" "))}</p>`);
                        paragraph = [];
                    }
                    if (isRule(line)) continue;
                    const tag = table ? "td" : "th";
                    table = table || [];
                    table.push(`<tr>${cells(line).map((c) => `<${tag}>${inline(c)}</${tag}>`).join("")}</tr>`);
                    continue;
                }
                if (!line) flush();
                else if (line.startsWith("## ")) { flush(); html.push(`<h2>${inline(line.slice(3))}</h2>`); }
                else if (line.startsWith("# ")) { flush(); html.push(`<h1>${inline(line.slice(2))}</h1><div class="bar"></div>`); }
                else if (line.startsWith("- ")) { flush(); html.push(`<p>- ${inline(line.slice(2))}</p>`); }
                else { if (table) flush(); paragraph.push(line); }
            }
            flush();
            return html.join("\n");
        }

        fetch("credits.md", { cache: "no-cache" })
            .then((r) => (r.ok ? r.text() : Promise.reject(new Error(r.status))))
            .then((md) => { document.getElementById("credits").innerHTML = render(md); })
            .catch(() => {
                document.getElementById("credits").insertAdjacentHTML("beforeend",
                    '<p>The credits could not be loaded. Read them in <a href="https://github.com/Kwaddo/gridlock-multiplayer-game/blob/main/CREDITS.md">CREDITS.md</a>.</p>');
            });
    </script>
</body>
</html>
